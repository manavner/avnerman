# Runs youtube-salsa/top_salsa.py in the cloud. Started from /salsa.html (api/salsa.js) or the Actions tab.
# Needs repo secrets YT_CLIENT_SECRET_JSON and YT_TOKEN_JSON (contents of client_secret.json / token.json).
name: Top 60 Salsa
run-name: "${{ inputs.topic }} · ${{ inputs.years && format('{0}y', inputs.years) || 'all years' }} · variety ${{ inputs.variety }} · ${{ inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "update = sync the YouTube playlist, dry-run = ranking only"
        type: choice
        options: [update, dry-run]
        default: update
      topic:
        description: "Genre, e.g. salsa, tango, rueda, reggaeton (Hebrew is fine), or searches separated by commas"
        type: string
        default: salsa
      years:
        description: "Only playlists created in the last N years (empty or 0 = any time)"
        type: string
        default: ""
      variety:
        description: "0 = exactly the top 60; 1-10 = the top 20 stay, the rest is drawn (1 ≈ 9 new songs, 5 ≈ 20, 10 ≈ 38)"
        type: string
        default: "5"

concurrency:
  group: top-salsa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: youtube-salsa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: youtube-salsa/requirements.txt

      - run: pip install -r requirements.txt

      # API responses are cached for the current ISO week: reruns in the same week cost ~3 quota units,
      # the first run of a new week fetches fresh data (~2,000 units).
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: youtube-salsa/cache.json
          key: salsa-cache-${{ steps.week.outputs.week }}-${{ github.run_id }}
          restore-keys: salsa-cache-${{ steps.week.outputs.week }}-

      - name: Write Google credentials
        env:
          CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          TOKEN: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRET" > client_secret.json
          printf '%s' "$TOKEN" > token.json

      - name: Rank and sync
        env:
          MODE: ${{ inputs.mode }}
          TOPIC: ${{ inputs.topic }}
          YEARS: ${{ inputs.years }}
          VARIETY: ${{ inputs.variety }}
        run: |
          args=(--topic "${TOPIC:-salsa}" --years "${YEARS:-0}" --variety "${VARIETY:-5}")
          if [ "$MODE" = "dry-run" ]; then args+=(--dry-run); fi
          python top_salsa.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salsa-ranking
          path: youtube-salsa/*_ranking.csv
          if-no-files-found: ignore

      - name: Remove credentials
        if: always()
        run: rm -f client_secret.json token.json
